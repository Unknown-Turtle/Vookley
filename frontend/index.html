<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vookley predicts the emotional arc of a track before you publish it. Runs entirely in your browser, validated against 176 human-rated songs." />
    <meta name="theme-color" content="#0f0f0e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vookley · Hear how it will feel</title>
    <script>
      try {
        var t = localStorage.getItem("vookley.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
